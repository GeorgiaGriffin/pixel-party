; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_f411re]
platform = ststm32
board = nucleo_f411re
framework = stm32cube

upload_protocol = stlink

monitor_speed = 115200

[env]
build_flags = 
    ; 1. Core Headers
    -I include
    
    ; 2. USB App & Target (Now located inside src)
    -I src/USB_DEVICE/App
    -I src/USB_DEVICE/Target
    
    ; 3. USB Middleware (Now located inside src)
    -I src/Middlewares/ST/STM32_USB_Device_Library/Core/Inc
    -I src/Middlewares/ST/STM32_USB_Device_Library/Class/CustomHID/Inc
    
    ; 4. Hardware Defines
    -D STM32F411xE
    -D USE_HAL_DRIVER
    -D HSE_VALUE=8000000  ;